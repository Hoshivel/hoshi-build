# Dependabot —— 讓釘住的版本不會腐爛。
#
# 各 workflow 的 `uses:` 全部釘 40 字元 commit SHA（安全發現 6）。**釘死之後
# 就必須有東西負責更新它**：一個沒有人維護的 SHA 會一路停在有已知問題的版本上，
# 而它看起來和一個剛更新過的 SHA 一模一樣。可變 tag 換到的自動更新是**代價**
# ——上游改了 tag 指向就換掉了我們跑的程式，沒有任何審閱——這裡把那件事換成
# 一個看得見、審得到的 PR。
#
# ## 為什麼要分組
#
# 沒有 `groups` 時 Dependabot **一個相依開一個 PR**，而
# `github/codeql-action` 的四個子 action（init／autobuild／analyze／upload-sarif）
# 各算一個——光 CodeQL 就是四個 PR，加上 trivy 是五個，乘以十二個倉庫。
# 那不是「更新被看見」，那是更新被淹掉。
#
# 分組之後每個生態系每週最多一個 PR。
#
# ## 為什麼不收 major
#
# major 是一次**遷移**，不是一次更新，而 Dependabot 判斷不了相依圖收不收得下。
# 實測（2026-08-11）：它替四個倉庫提了 `typescript` 5.9 → 7.0，
# 而 `@astrojs/check` 的 peer 範圍是 `^5 || ^6`——`npm ci` 直接 ERESOLVE，
# **那些 PR 沒有任何一顆有機會變綠**。
#
# 一個沒有人能處理的紅燈，最後會被學會忽略，連同它旁邊那個真的紅燈一起
# （見 workspace `decisions/process/掃描的紅燈要有人處理得了.md`）。
# 所以 major 不自動開 PR；要升的時候由人讀 changelog、一次做完。
#
# **這不影響有漏洞的相依**：那走 Dependabot alerts 與 security updates，
# 與這裡的版本更新是兩條路。
version: 2
updates:
  # workflow 裡釘住的 action SHA。全部收在一個 PR 裡。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # Go 相依。major 由人手動升（見檔頭）。
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      go:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
