# 發佈 release 時，建出各平臺的單檔二進位並附上去。
#
# **觸發的是「發佈 release」，不是「推 tag」。** 只要走 release 發版就該建置——
# 不管版本號長什麼樣、是不是 rc。`published` 對正式版與預發行版都會觸發，
# 所以這裡不篩 tag 名，也不需要判斷 prerelease：那是發版的人在 UI 上決定的事，
# 與「要不要建置」無關。
#
# **產物名稱不在這裡決定。** 建置規範 §2.2（硬性）規定它是 `<name>-<os>-<arch>`，
# 而那正是 `hoshi build` 本來就會產出的名字，所以這裡直接上傳 `dist/` 底下的東西。
# 在工作流程裡自己拼一次檔名，等於把命名規則複製到一個沒有測試盯著的地方。
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write # 上傳產物到 release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 明講要建的是這個 release 的 tag，不要靠預設值推。
          ref: ${{ github.event.release.tag_name }}
          # 版本字串來自 `git describe --tags`。預設的淺 clone 取不到 tag，
          # 版本會安靜地退成 `dev`，而唯一發現的時機是有人對釋出的產物打
          # `hoshi version`——那時它已經在別人的機器上了。
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # 先驗再釋出：沒跑過測試的產物不該掛上 release 頁面。
      - name: hoshi test
        run: go run ./cmd/hoshi test

      # 每個目標都是**單一檔**：hoshi 是 `type: go` 且沒有 `include`，
      # 沒有隨附內容就不該有目錄（部署標準 §1.1〈可單檔部署〉）。
      # linux 的 ELF 產物會在建置當下驗 PT_INTERP；darwin / windows 明講
      # 「未檢查」，不假裝綠燈。
      - name: hoshi build
        run: >
          go run ./cmd/hoshi build
          -target linux/amd64,linux/arm64,darwin/amd64,darwin/arm64,windows/amd64

      # release 必然已經存在——它的發佈就是觸發本次執行的那件事——所以這裡只上傳，
      # 不建立，也不碰標題與說明：那些是發版的人寫的。
      # `--clobber` 讓重跑這一步是冪等的。
      - name: 上傳產物
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
