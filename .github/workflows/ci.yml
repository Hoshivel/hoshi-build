# 主分支的驗證。
#
# 這裡**不寫** `go build` 的旗標。建置規範 §3 規定倉庫不得在文件或 CI 裡重寫它們，
# 而本倉庫正是那條規則的執法者——CI 自己打一行 `CGO_ENABLED=0 go build …`
# 就是多出一份沒有測試盯著的副本，而它漂移的那天沒有人會發現。
# 因此一律自舉：呼叫 `hoshi` 自己，旗標的正本留在 internal/build/gobuild.go。
name: CI

on:
  push:
    branches: [main]
  # 開了 PR 就在合併前先驗一次，**草稿也跑**（裁示 2026-08-21）。
  #
  # 沒有開 PR 的分支仍然不會觸發，所以「工作分支的頻繁推送不該花 CI」照舊
  # 成立；改掉的是草稿那一段。草稿不跑換到的是迭代期間省下的分鐘數，而升上
  # Enterprise 之後那不是收益；付出的是**最需要早點知道的那個階段沒有網子**。
  #
  # > **註**：這段註解在 2026-08-21 之前寫著「草稿不跑（下面每個 job 的
  # > `if`）」，而那個 `if` **十五個倉庫裡只有兩個真的有**（hoshi-build 與
  # > hoshi-standards）。也就是說十三個倉庫的草稿 PR 一直都在跑 CI，
  # > 註解描述的是一件沒有發生的事。它的方向是「以為更省」，
  # > 所以不會有任何帳單或紅燈讓人發現它——**一份說謊的註解不會自己壞掉**。
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# 同一個 PR 上再推一次，就取消前一次還沒跑完的執行，只留最後一顆 commit 的結果。
#
# **`main` 不取消**（所以用 event_name 判斷，不是無條件 true）：那裡的每一次
# 執行都對應一次真的合併，取消掉就沒有任何地方記得那次合併驗過沒有——
# 而那正是加 CI 想消滅的狀態。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # 版本跟著 go.mod 走，不在這裡再釘一次——兩個地方寫同一個版本號，
          # 遲早只有一個會被更新。
          go-version-file: go.mod

      # 自舉其一：本工具測試它自己。
      # gofmt -l → go vet → go build → go test -race，第一個失敗就停。
      - name: hoshi test
        run: go run ./cmd/hoshi test

      # internal/dev 有平臺相依的檔案（proc_unix.go / proc_windows.go），兩邊都要
      # 編得過。這是編譯檢查、不產出任何要部署的東西，因此不是 §3 說的那種
      # 「在 CI 裡重寫建置旗標」。
      - name: 交叉編譯檢查（windows）
        run: GOOS=windows go build ./...

      # 自舉其二：本工具建置它自己。`.hoshi-build.yaml` 是本倉庫自己的設定，
      # 它壞掉時最先發現的應該是本倉庫的維護者。
      - name: hoshi build
        run: go run ./cmd/hoshi build

      # **覆蓋率：量出來、報出來，不設下限。**
      #
      # 2026-08-21 之前**沒有任何倉庫量過**——十五個倉庫的 workflow 裡
      # `-coverprofile` 一次都沒有出現。一個沒有人看過的數字不會自己變好，
      # 但更要緊的是：**沒有量的時候，覆蓋率掉下去是沒有症狀的。**
      #
      # 刻意**不設下限**。當天量到的十個 Go 倉庫是 42.5%～81.6%，跨度太大，
      # 一個統一的數字要嘛擋不住任何東西、要嘛讓兩個倉庫從第一天起就紅——
      # 而一個永遠紅著的檢查等於沒有檢查。下限等使用者看過真實數字再定，
      # 追蹤在 workspace `todo/CI-覆蓋率-把-CI-做得到的全部跑起來.md`。
      #
      # **這個數字不含環境相依的那幾層**（要真的資料庫／瀏覽器／服務的那些，
      # 見同倉庫其他 workflow）。它量的是這個 job 裡跑得到的部分，
      # 所以它會比「所有測試都跑起來」的覆蓋率低——不要把它讀成後者。
      - name: 覆蓋率
        run: |
          set -euo pipefail
          go test -count=1 -covermode=atomic -coverprofile=coverage.out ./...
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')
          echo "總覆蓋率：${total}"
          {
            echo "### 測試覆蓋率"
            echo
            echo "本 job 跑得到的部分：**${total}**"
            echo
            echo "> 不含環境相依的那幾層（真的資料庫／瀏覽器／服務），那些有自己的 workflow。"
            echo
            echo '<details><summary>逐套件</summary>'
            echo
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
            echo
            echo '</details>'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 保留覆蓋率報告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          retention-days: 30
          if-no-files-found: warn

  verify-windows-dev:
    # Windows 的 Job Object 與 CTRL_BREAK 行為無法靠交叉編譯驗證；這組測試會真的
    # 啟動父／子／孫行程，確認優雅中斷、五秒強制期限、外層 hoshi 異常死亡，以及
    # 最後連接埠是否確實釋放。
    #
    # **草稿 PR 也跑**（裁示 2026-08-21）：這裡原本有一條
    # `if: … || github.event.pull_request.draft == false`。見上方 `on:` 的註解。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Windows dev 行程收尾
        run: go test ./internal/dev -count=1

  # 安全掃描接在基礎驗證之後：基礎驗證紅燈時整組 **skipped**，而不是拿一份
  # 編譯不過的原始碼去跑掃描，再收到一顆與根因無關的第二紅燈。
  #
  # > **註**：這段文字到 2026-08-21 為止寫的是「**本倉庫是公開的，所以掃描與
  # > 基礎驗證同時起跑**，不等它綠燈」，理由是公開倉庫的 Actions 分鐘數不計費。
  # > 那個形狀在 2026-08-16 就被取代了，而**取代它的 `needs:` 一直都在**
  # > （就在下面幾行，還帶著自己的註解）——沒有跟上的只有這段文字。
  # >
  # > 它還聲明「兩種形狀是刻意的，不是漂移；判準見 workspace `AGENTS.md`
  # > §1.9.1」，而 §1.9.1 說的正好相反。**一段指著條文說自己不必照辦的註解，
  # > 比沒有註解更糟**：它讓讀者以為這裡已經對照過了，於是沒有人去比對。
  #
  # 掃描本身的定義在 `security.yml`，那支同時還掛著每週排程（**不**經過這道閘）。
  security:
    # **這一組在 PR 上也跑，但裡面只有 Gitleaks 會動**（裁示 2026-08-16）。
    #
    # 判準是「漏到 `main` 之後要付什麼」：
    #
    # | | 補救 |
    # |---|---|
    # | CodeQL／govulncheck／Trivy | **修程式**，修好就結束 |
    # | **Gitleaks** | 刪掉不夠——憑證已經在 git 歷史裡，**必須輪替** |
    #
    # 前三種在 PR 攔下與在 `main` 攔下代價一樣，所以留在 `main`（省下每個 PR
    # 數分鐘）；Gitleaks 是唯一代價不同的，所以掛回 PR。
    #
    # **閘門下移到被呼叫的那三個 job 上**（`security.yml` 裡各自的
    # `if: github.event_name != 'pull_request'`），不是留在這裡——留在這裡會把
    # Gitleaks 一起關掉。這樣做同時保住了檢查名稱：它仍然是
    # `安全掃描 / Gitleaks`，按名字釘住的分支保護不受影響。
    name: 安全掃描
    # 閘門對公開倉庫也成立了（裁示 2026-08-16）：掃描要先等基礎驗證綠。
    # 取代 workspace decisions/infrastructure/公開倉庫的掃描不經閘門.md
    needs: [verify, verify-windows-dev]
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      # 呼叫端的權限是被呼叫 job 的**上限**，所以這裡要給到聯集。
      # CodeQL 與 Trivy 上傳 SARIF 要 security-events: write；
      security-events: write
      # CodeQL 在**私有倉庫**要讀本次 run 的資訊，少了它掃描全成功、
      # job 卻以 `Resource not accessible by integration` 收場。
      actions: read
    # 掃描要建置本倉庫，而建置可能需要 HOSHIVEL_CI_TOKEN（私有 module）。
    secrets: inherit
