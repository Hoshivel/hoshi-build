# 主分支的驗證。
#
# 這裡**不寫** `go build` 的旗標。建置規範 §3 規定倉庫不得在文件或 CI 裡重寫它們，
# 而本倉庫正是那條規則的執法者——CI 自己打一行 `CGO_ENABLED=0 go build …`
# 就是多出一份沒有測試盯著的副本，而它漂移的那天沒有人會發現。
# 因此一律自舉：呼叫 `hoshi` 自己，旗標的正本留在 internal/build/gobuild.go。
name: CI

on:
  push:
    branches: [main]
  # 開了 PR 就在合併前先驗一次，但**草稿不跑**（下面每個 job 的 `if`）。
  # 迭代期間開成 draft，改好再標 ready for review——那一刻才觸發。
  #
  # 這與「工作分支的頻繁推送不該花 CI」並不衝突：沒有開 PR 的分支不會觸發，
  # 開了 PR 但還是草稿的也不會。換到的是**合併前就知道壞了**，
  # 而不是像 2026-08-08 那次要等合併後才發現 hoshi-deploy 是紅的。
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# 同一個 PR 上再推一次，就取消前一次還沒跑完的執行，只留最後一顆 commit 的結果。
#
# **`main` 不取消**（所以用 event_name 判斷，不是無條件 true）：那裡的每一次
# 執行都對應一次真的合併，取消掉就沒有任何地方記得那次合併驗過沒有——
# 而那正是加 CI 想消滅的狀態。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    # 草稿 PR 不跑。push 與手動觸發不受影響。
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # 版本跟著 go.mod 走，不在這裡再釘一次——兩個地方寫同一個版本號，
          # 遲早只有一個會被更新。
          go-version-file: go.mod

      # 自舉其一：本工具測試它自己。
      # gofmt -l → go vet → go build → go test -race，第一個失敗就停。
      - name: hoshi test
        run: go run ./cmd/hoshi test

      # internal/dev 有平臺相依的檔案（proc_unix.go / proc_windows.go），兩邊都要
      # 編得過。這是編譯檢查、不產出任何要部署的東西，因此不是 §3 說的那種
      # 「在 CI 裡重寫建置旗標」。
      - name: 交叉編譯檢查（windows）
        run: GOOS=windows go build ./...

      # 自舉其二：本工具建置它自己。`.hoshi-build.yaml` 是本倉庫自己的設定，
      # 它壞掉時最先發現的應該是本倉庫的維護者。
      - name: hoshi build
        run: go run ./cmd/hoshi build

  # **本倉庫是公開的，所以掃描與 `verify` 同時起跑**，不等它綠燈。
  #
  # 公開倉庫的 Actions 分鐘數不計費，所以「基礎驗證紅燈時整組 skipped、
  # 省下執行器時間」在這裡換不到任何東西，只換到更晚才知道掃描的結論。
  # 代價要講清楚：建置壞掉時 CodeQL 的 autobuild 與 govulncheck 會吐同一個
  # 編譯錯誤換一種包裝，所以一顆真的紅燈會伴隨幾顆指向同一個根因的紅燈。
  #
  # **私有倉庫維持 `needs:` 那道閘**——那裡的分鐘數要付錢。兩種形狀是刻意的，
  # 不是漂移；判準與理由見 workspace `AGENTS.md` §1.9.1。
  #
  # 掃描本身的定義在 `security.yml`，那支同時還掛著每週排程。
  security:
    # 草稿 PR 不跑。**這一行不能省**：沒有 `needs:` 之後，草稿的 skip 不再從
    # 基礎驗證那邊傳遞過來，少了它草稿 PR 會開始跑掃描。
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: 安全掃描
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      # 呼叫端的權限是被呼叫 job 的**上限**，所以這裡要給到聯集。
      # CodeQL 與 Trivy 上傳 SARIF 要 security-events: write；
      security-events: write
      # CodeQL 在**私有倉庫**要讀本次 run 的資訊，少了它掃描全成功、
      # job 卻以 `Resource not accessible by integration` 收場。
      actions: read
    # 掃描要建置本倉庫，而建置可能需要 HOSHIVEL_CI_TOKEN（私有 module）。
    secrets: inherit
